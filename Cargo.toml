[package]
name = "arc"
authors = ["Nathan Aronson"]
description = "A bytecode-compiled programming language with a virtual machine written in Rust."
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phf = { version = "0.13.1", features = ["macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "17.0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
